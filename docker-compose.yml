# Nur die Datenbank für die Entwicklung auf diesem Rechner.
#
# Die Anwendung selbst läuft bei Hostinger als Node-Prozess und im Betrieb
# gegen Supabase in Frankfurt – dafür braucht es hier nichts.
services:
  postgres:
    image: postgres:17-alpine
    container_name: garagentor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garagentor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garagentor}
      POSTGRES_DB: ${POSTGRES_DB:-garagentor}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-garagentor} -d ${POSTGRES_DB:-garagentor}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
