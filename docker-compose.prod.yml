# Produktivbetrieb auf einem eigenen Server.
#
#   cp .env.prod.example .env.prod
#   # Domain, Mailadresse und Passwörter eintragen, Secrets erzeugen:
#   #   openssl rand -base64 48
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Caddy nimmt Port 80 und 443 entgegen, holt das Zertifikat selbst bei
# Let's Encrypt und verteilt: /api an das Backend, alles Übrige an die
# Oberfläche. Datenbank und Anwendungen sind von außen nicht erreichbar –
# sie hängen nur am internen Netz.

# Eigener Projektname: sonst teilt sich der Produktivbetrieb die Volumes mit
# dem Entwicklungs-Stack aus docker-compose.yml. Eine bereits angelegte
# Datenbank übernimmt kein neues Passwort mehr – die Anmeldung schlüge fehl.
name: garagentor-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: ${POSTGRES_DB:-garagentor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-garagentor}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [intern]

  # Läuft einmal vor der Anwendung durch und bringt das Schema auf Stand.
  # Dieselbe Stufe dient als Werkzeugkasten für einmalige Aufgaben:
  #
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod \
  #     run --rm -e ADMIN_EMAIL=… -e ADMIN_PASSWORD=… \
  #     migrate npm run db:admin --workspace @garagentor/api
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    command: npx prisma migrate deploy
    working_dir: /app/apps/api
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-garagentor}?schema=public
    networks: [intern]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-garagentor}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET fehlt}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET fehlt}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # Gleiche Domain für Oberfläche und Schnittstelle, deshalb reicht der
      # eigene Ursprung.
      CORS_ORIGIN: https://${DOMAIN:?DOMAIN fehlt}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - api-uploads:/app/uploads
    networks: [intern]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Relativer Pfad: der Browser ruft die Schnittstelle unter derselben
        # Domain auf, die auch die Oberfläche ausliefert.
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    depends_on: [api]
    networks: [intern]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL fehlt}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [intern]

volumes:
  postgres-data:
  api-uploads:
  caddy-data:
  caddy-config:

networks:
  intern:
